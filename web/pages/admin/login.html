<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitalPDS | Admin Login</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/auth.css" />
</head>
<body class="auth-body auth-admin">
  <div class="auth-page">
    <div class="auth-shell">
      <div class="auth-top-space"></div>

      <div class="auth-icon-card admin-theme">
        <div class="auth-icon">A</div>
      </div>

      <div class="auth-header">
        <h1>Admin Login</h1>
        <p>Oversee system operations</p>
      </div>

      <section class="auth-card">
        <form id="adminLoginForm" novalidate>
          <div class="form-group">
            <label for="admin-email">Admin Email</label>
            <input
              type="email"
              id="admin-email"
              name="email"
              placeholder="Enter admin email"
              autocomplete="email"
            />
            <p class="field-error" id="admin-email-error"></p>
          </div>

          <div class="form-group">
            <label for="admin-password">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="admin-password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
              />
              <button type="button" class="toggle-password" data-target="admin-password">
                Show
              </button>
            </div>
            <p class="field-error" id="admin-password-error"></p>
          </div>

          <button type="submit" class="login-btn admin-btn" id="admin-login-btn">
            <span class="btn-text">Login</span>
            <span class="btn-loader hidden"></span>
          </button>

        </form>
      </section>

      <div class="auth-bottom">
        <a href="../../index.html" class="back-link admin-link">Back to Role Selection</a>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
</body>
</html>
