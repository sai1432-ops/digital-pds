<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitalPDS | Dealer Login</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/auth.css" />
</head>
<body class="auth-body auth-dealer">
  <div class="auth-page">
    <div class="auth-shell">
      <div class="auth-top-space"></div>

      <div class="auth-icon-card dealer-theme">
        <div class="auth-icon">D</div>
      </div>

      <div class="auth-header">
        <h1 class="dealer-text">Dealer Login</h1>
        <p>Access your dealer dashboard</p>
      </div>

      <section class="auth-card">
        <form id="dealerLoginForm" novalidate>
          <div class="form-group">
            <label for="dealer-email">Dealer Email</label>
            <input
              type="email"
              id="dealer-email"
              name="email"
              placeholder="Enter dealer email"
              autocomplete="email"
            />
            <p class="field-error" id="dealer-email-error"></p>
          </div>

          <div class="form-group">
            <label for="dealer-password">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="dealer-password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
              />
              <button type="button" class="toggle-password" data-target="dealer-password">
                Show
              </button>
            </div>
            <p class="field-error" id="dealer-password-error"></p>
          </div>

          <div class="inline-link-row">
            <a href="#" class="text-link dealer-link">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn dealer-btn" id="dealer-login-btn">
            <span class="btn-text">Login</span>
            <span class="btn-loader hidden"></span>
          </button>
        </form>
      </section>

      <div class="auth-bottom">
        <a href="../../index.html" class="back-link dealer-link">Back to Role Selection</a>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
</body>
</html>
